<body>
  <script src="http://koda.nu/simple.js">

  // 1. Skapa variabler för första figuren
  var x = 120;
  var y = 180;
  var storlek = 40;
  var färg = "red"

  // Rita första figuren med variabler
  circle(x, y, storlek, färg);

  // 2. Skapa ett objekt för andra figuren (player)
  var player = { x: 300, y: 250, size: 100, color: "green" }

  // Rita andra figuren med objektets egenskaper
  circle(player.x, player.y, player.size, player.color);

var spelare = {

    x:850, 
    y:100
}

line(spelare.x, spelare.y + 100, spelare.x, spelare.y + 300, 10, "red");
ring(spelare.x, spelare.y + 50, 50, 10, "red")
rectangle(spelare.x - 75, spelare.y + 150, 150, 10, "red")
line(spelare.x, spelare.y + 300, spelare.x - 75, spelare.y + 375, 10, "red")
line(spelare.x, spelare.y + 300, spelare.x + 75, spelare.y + 375, 10, "red")

  </script>
