<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
    var player = { x: 50, y : 50, size: 40, color: "blue", speedX: 3, speedY: 2, direction: 1, directionY: 2}
    
    function update() {
        clearScreen();
        circle(player.x, player.y, player.size, player.color);
        player.x = player.x + player.speedX * player.direction;
        player.y = player.y + playerspeedY * player.directionY;

        if (player.x + player.size > totalWidth) {
            player.direction = -1;
            
         if (player.x - player.size < 0) {
                player.direction = 1;

         if (player.y - player.size < 0) {
            player.directionY = 1;

                }
            }
        }
    }
  </script>
</body>
</html>
